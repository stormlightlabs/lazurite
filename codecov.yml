coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80% # our true target is 95%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 80% # true target is 95%
        threshold: 1%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "**/*_route_args.dart"
  - "**/*_event.dart"
  - "test/**"
