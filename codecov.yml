coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80% # our true target is 95%
        threshold: 1%
        if_ci_failed: error

    patch:
      default:
        target: 80% # true target is 95%
        threshold: 1%

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "lib/src/app/**"
  - "lib/src/infrastructure/db/tables.dart"
  - "lib/src/infrastructure/network/http_method.dart"
  - "lib/src/infrastructure/network/host_kind.dart"
  - "lib/src/infrastructure/network/proxy_kind.dart"
  - "lib/src/infrastructure/network/endpoint_meta.dart"
  - "test/**"
