<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazurite Authentication Complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/static/shared.css" />
  </head>
  <body class="legal-page oauth-callback-page">
    <div class="container oauth-callback-container">
      <main class="legal-card oauth-callback-main">
        <h1>Authentication Complete</h1>
        <p class="lead oauth-callback-copy">Lazurite is finishing sign-in. If the app does not reopen automatically, tap below.</p>
        <a id="reopen-link" class="oauth-callback-button" href="#">Open Lazurite</a>
        <p class="meta oauth-callback-hint">If this still fails, use your browser menu and choose “Open in app”.</p>
      </main>
    </div>
    <script>
      const query = window.location.search || '';
      const fragment = window.location.hash || '';
      const reopenUrl = `org.stormlightlabs.lazurite:/oauth/callback${query}${fragment}`;
      const reopenLink = document.getElementById('reopen-link');
      const autoOpenKey = `lazurite.oauth.reopen.${query}${fragment}`;

      reopenLink.setAttribute('href', reopenUrl);

      function attemptReopen() {
        try {
          if (window.sessionStorage.getItem(autoOpenKey) === '1') {
            return;
          }
          window.sessionStorage.setItem(autoOpenKey, '1');
        } catch (err) {
          console.debug("Storage unavailable; trying a single best-effort reopen.", err);
        }
        window.location.assign(reopenUrl);
      }

      window.addEventListener('load', function () {
        window.setTimeout(attemptReopen, 250);
      });
    </script>
  </body>
</html>
