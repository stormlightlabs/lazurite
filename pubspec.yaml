name: lazurite
description: A material BlueSky client.
publish_to: "none"

# Version number can be overriden by specifying --build-name and --build-number, respectively.
#
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
#
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
#
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^17.0.1

  # State Management
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Typography
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.10.0
  uuid: ^4.5.2
  jwt_decoder: ^2.0.1
  jose: ^0.3.5
  crypto: ^3.0.7
  collection: ^1.19.1
  characters: ^1.4.0
  shelf: ^1.4.2
  html: ^0.15.5

  # Persistence
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.9.0
  gal: ^2.3.0
  share_plus: ^10.1.3
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  equatable: ^2.0.8
  extended_text_field: ^16.0.2
  animations: ^2.1.1
  flutter_svg: ^2.0.10+1
  dynamic_color: ^1.8.1
  package_info_plus: ^9.0.0
  flutter_json: ^0.0.6
  video_player: ^2.9.2
  chewie: ^1.8.5
  vector_math: ^2.1.4
  language_detector: ^1.0.1

  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  # Code Generation
  build_runner: ^2.10.5
  riverpod_generator: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.30.1

  # Mocking
  http_mock_adapter: ^0.6.1
  mocktail: ^1.0.4
  mocktail_image_network: ^1.2.0
  fake_async: ^1.3.3
  image_picker_platform_interface: ^2.9.0
  plugin_platform_interface: ^2.1.0
  webview_flutter_platform_interface: ^2.10.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts. Example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
