<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Lazurite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg) 0%, var(--surface) 100%);
    }

    .app-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 8px 0;
      min-height: 56px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--surface-variant); }
    .icon-btn svg { width: 22px; height: 22px; }

    .login-body {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow-y: auto;
      padding: 0 24px 24px;
    }

    .login-content {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
    }

    .logo-card {
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
      border-radius: 24px;
      margin: 16px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 102, 255, 0.24);
    }

    .logo-card svg {
      width: 44px;
      height: 44px;
      color: white;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      margin: 24px 0 0;
      letter-spacing: -0.5px;
    }

    .app-tagline {
      color: var(--text-secondary);
      font-size: 15px;
      text-align: center;
      margin: 8px 0 32px;
    }

    .provider-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .provider-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: none;
    }

    .segmented-control {
      display: flex;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 3px;
      gap: 2px;
    }

    .segment {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 50px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .segment.active {
      background: var(--accent-primary);
      color: #fff;
    }

    .segment svg {
      width: 16px;
      height: 16px;
    }

    .search-bar {
      display: flex;
      align-items: center;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      transition: border-color 0.15s, box-shadow 0.15s;
      overflow: visible;
      margin-bottom: 0;
    }

    .search-bar:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
    }

    .search-bar .input-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-left: 14px;
      color: var(--text-muted);
    }

    .search-bar .input {
      flex: 1;
      border: none !important;
      outline: none !important;
      background: transparent;
      box-shadow: none !important;
      padding: 14px 10px;
      font-size: 15px;
    }

    .search-bar .input:focus {
      border: none;
      box-shadow: none;
    }

    .btn-continue {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      margin: 5px;
      border-radius: 10px;
      background: var(--accent-primary);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-continue:hover { background: var(--accent-primary-hover); }
    .btn-continue:active { transform: scale(0.92); }
    .btn-continue svg { width: 18px; height: 18px; }

    .typeahead-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    .typeahead-dropdown {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.10);
      z-index: 10;
      overflow: hidden;
    }

    .typeahead-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background 0.1s;
    }

    .typeahead-item:hover { background: var(--surface); }

    .typeahead-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-variant);
      flex-shrink: 0;
      overflow: hidden;
    }

    .typeahead-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .typeahead-handle {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
    }

    .typeahead-display-name {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .account-switcher {
      margin-top: 28px;
    }

    .account-switcher-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .account-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .account-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: 12px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: border-color 0.15s, background 0.15s;
    }

    .account-item:hover {
      border-color: var(--border);
      background: var(--bg);
    }

    .account-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
      font-weight: 700;
    }

    .account-info {
      flex: 1;
      min-width: 0;
    }

    .account-display-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-handle {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-remove {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.1s, color 0.1s;
    }
    .account-remove:hover { background: var(--surface-variant); color: var(--accent-error); }
    .account-remove svg { width: 16px; height: 16px; }

    .divider-with-text {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .divider-with-text::before,
    .divider-with-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background-color: var(--border);
    }

    .debug-section {
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .debug-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
    }

    .debug-icon {
      color: var(--text-secondary);
    }
    .debug-icon svg { width: 20px; height: 20px; }

    .debug-title {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 15px;
      flex: 1;
    }

    .debug-toggle {
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
    }
    .debug-toggle:hover { background: var(--surface); }

    .debug-body {
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .debug-body.hidden { display: none; }

    .help-text {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    .login-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    .footer-btn {
      border: none;
      background: transparent;
      color: var(--accent-primary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.1s;
    }
    .footer-btn:hover { background: var(--surface); }

    .footer-dot {
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="login-screen">

      <div class="app-bar">
        <button class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>

      <div class="login-body">
        <div class="login-content">

          <div class="logo-card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"/>
              <path d="M2 17l10 5 10-5"/>
              <path d="M2 12l10 5 10-5"/>
            </svg>
          </div>

          <h1 class="app-name">Lazurite</h1>
          <p class="app-tagline">Roam the ATmosphere</p>

          <div class="provider-section">
            <span class="provider-label">Choose your portal</span>
            <div class="segmented-control">
              <button class="segment active" onclick="selectProvider(this, 'bluesky')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 2c4.418 0 8 3.582 8 8s-3.582 8-8 8-8-3.582-8-8 3.582-8 8-8z"/>
                </svg>
                BlueSky
              </button>
              <button class="segment" onclick="selectProvider(this, 'blacksky')">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="12" r="8"/>
                </svg>
                BlackSky
              </button>
            </div>
          </div>

          <div class="typeahead-wrapper">
            <div class="typeahead-dropdown" id="typeahead-dropdown" style="display:none;">
              <div class="typeahead-item" onclick="selectHandle('alice.bsky.social')">
                <div class="typeahead-avatar">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                    <circle cx="12" cy="8" r="4" fill="var(--text-muted)"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="var(--text-muted)"/>
                  </svg>
                </div>
                <div>
                  <div class="typeahead-handle">alice.bsky.social</div>
                  <div class="typeahead-display-name">Alice</div>
                </div>
              </div>
              <div class="typeahead-item" onclick="selectHandle('alice.arts.bsky.social')">
                <div class="typeahead-avatar">
                  <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32">
                    <circle cx="12" cy="8" r="4" fill="var(--text-muted)"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="var(--text-muted)"/>
                  </svg>
                </div>
                <div>
                  <div class="typeahead-handle">alice.arts.bsky.social</div>
                  <div class="typeahead-display-name">Alice Arts</div>
                </div>
              </div>
            </div>

            <div class="search-bar">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input
                type="text"
                class="input"
                placeholder="username.bsky.social or did:plc:..."
                id="handle-input"
                autocomplete="off"
                oninput="onHandleInput(this)"
              >
              <button class="btn-continue" id="continue-btn" title="Continue">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"/>
                  <polyline points="12 5 19 12 12 19"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="account-switcher">
            <div class="account-switcher-header">Saved accounts</div>
            <div class="account-list">
              <div class="account-item" onclick="switchAccount('jay.bsky.social')">
                <div class="account-avatar">J</div>
                <div class="account-info">
                  <div class="account-display-name">Jay</div>
                  <div class="account-handle">jay.bsky.social</div>
                </div>
                <button class="account-remove" title="Remove account" onclick="removeAccount(event, 'jay.bsky.social')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
              <div class="account-item" onclick="switchAccount('rose.bsky.social')">
                <div class="account-avatar" style="background: linear-gradient(135deg, #e879f9, #a21caf);">R</div>
                <div class="account-info">
                  <div class="account-display-name">Rose</div>
                  <div class="account-handle">rose.bsky.social</div>
                </div>
                <button class="account-remove" title="Remove account" onclick="removeAccount(event, 'rose.bsky.social')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="divider-with-text">Debug</div>

          <div class="debug-section">
            <div class="debug-header">
              <span class="debug-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
              </span>
              <span class="debug-title">App Password Login</span>
              <button class="debug-toggle" id="debug-toggle" onclick="toggleDebug()">Show</button>
            </div>
            <div class="debug-body hidden" id="debug-body">
              <div class="input-group" style="margin-bottom:0; margin-top:0;">
                <div class="input-with-icon">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                  <input type="password" class="input" placeholder="xxxx-xxxx-xxxx-xxxx">
                </div>
              </div>
              <button class="btn btn-secondary" style="width:100%; display:flex; align-items:center; justify-content:center; gap:8px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                  <polyline points="10 17 15 12 10 7"/>
                  <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Sign In
              </button>
              <p class="help-text">
                Can be generated via BlueSky's App Passwords section at bsky.app.
              </p>
            </div>
          </div>

          <div class="login-footer">
            <button class="footer-btn">Terms of Service</button>
            <span class="footer-dot">•</span>
            <button class="footer-btn">Privacy Policy</button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    function selectProvider(btn, provider) {
      document.querySelectorAll('.segment').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
    }

    let debounceTimer;
    function onHandleInput(input) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const dropdown = document.getElementById('typeahead-dropdown');
        dropdown.style.display = input.value.length >= 2 ? 'block' : 'none';
      }, 300);
    }

    function selectHandle(handle) {
      document.getElementById('handle-input').value = handle;
      document.getElementById('typeahead-dropdown').style.display = 'none';
    }

    function toggleDebug() {
      const body = document.getElementById('debug-body');
      const toggle = document.getElementById('debug-toggle');
      const hidden = body.classList.toggle('hidden');
      toggle.textContent = hidden ? 'Show' : 'Hide';
    }

    function switchAccount(handle) {
      document.getElementById('handle-input').value = handle;
    }

    function removeAccount(event, handle) {
      event.stopPropagation();
      const item = event.currentTarget.closest('.account-item');
      item.remove();
      const list = document.querySelector('.account-list');
      if (!list.children.length) {
        document.querySelector('.account-switcher').remove();
      }
    }

    // Close typeahead on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.typeahead-wrapper')) {
        document.getElementById('typeahead-dropdown').style.display = 'none';
      }
    });
  </script>
</body>
</html>
